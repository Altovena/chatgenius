name: Chess authentication email routing

on:
  pull_request:
    paths:
      - 'supabase/functions/auth-branded-email/**'
      - 'tests/chess-auth-email-routing.test.mjs'
      - '.github/workflows/chess-auth-email-routing.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/auth-branded-email/**'
      - 'tests/chess-auth-email-routing.test.mjs'
      - '.github/workflows/chess-auth-email-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/chess-auth-email-routing.test.mjs
