name: DemoSites live browser quality audit
on:
  pull_request:
    paths:
      - 'scripts/qa-demosites-live.py'
      - '.github/workflows/demosites-live-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  live-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Audit 10 public demos on desktop and mobile
        run: python scripts/qa-demosites-live.py
      - name: Preserve screenshot evidence and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demosites-live-browser-evidence
          path: artifacts/demosites-browser/
          if-no-files-found: warn
          retention-days: 14
